};

function fmtClp(n) {
    return '$' + Math.round(Number(n || 0)).toLocaleString('es-CL');
}

function showToast(msg, type = 'success') {
    const c = document.getElementById('toast-container');
    const styles = type === 'error'
        ? 'bg-red-50 border-red-200 text-red-900'
        : (type === 'warning' ? 'bg-amber-50 border-amber-300 text-amber-900' : 'bg-emerald-50 border-emerald-200 text-emerald-900');
    const icon = type === 'error' ? '🚨' : (type === 'warning' ? '⚠️' : '✅');
    c.innerHTML = `<div class="p-3.5 rounded-xl border ${styles} text-xs font-semibold flex items-center justify-between shadow-sm">
        <span>${icon} ${msg}</span>
        <button onclick="document.getElementById('toast-container').innerHTML=''" class="font-bold ml-4">✕</button>
    </div>`;
}

function closeModal() {
    document.getElementById('app-modal').classList.add('hidden');
}

function showLoginScreen() {
    document.getElementById('app-shell').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
}

function loginWithRole(role) {
    state.role = role;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-shell').classList.remove('hidden');

    const u = ROLES_USER[role];
    document.getElementById('user-avatar').textContent = u.nombre.charAt(0);
    document.getElementById('user-name').textContent = u.nombre;
    document.getElementById('user-rut').textContent = u.rut;
    const badge = document.getElementById('user-role-badge');
    badge.className = 'inline-block text-[10px] font-semibold px-2.5 py-0.5 rounded-md border ' + u.badge;
    badge.textContent = u.label;

    ['vendedor', 'quimico_farmaceutico', 'bodeguero', 'administrador'].forEach(r => {
        const b = document.getElementById('role-btn-' + r);
        if (!b) return;
        const activeColors = {
            vendedor: 'bg-blue-600 text-white font-semibold',
            quimico_farmaceutico: 'bg-emerald-600 text-white font-semibold',
            bodeguero: 'bg-amber-600 text-white font-semibold',
            administrador: 'bg-purple-600 text-white font-semibold'
        };
        b.className = 'w-full text-left px-2 py-1 rounded text-[10px] ' + (r === role ? activeColors[r] : 'bg-slate-800 text-slate-300 hover:bg-slate-700');
    });

    const allowed = getAllowedViews(role);
    if (!allowed.includes(state.view)) {
        state.view = u.home;
    }
    showToast(`Sesión activa como ${u.nombre} (${u.label}).`);
    render();
}

function getAllowedViews(role) {
    if (role === 'administrador') return ['dashboard', 'pos', 'autorizaciones', 'inventario', 'convenios', 'usuarios'];
    if (role === 'quimico_farmaceutico') return ['pos', 'autorizaciones', 'inventario', 'convenios'];
    if (role === 'bodeguero') return ['inventario'];
    return ['pos', 'inventario', 'convenios'];
}

function navigate(view) {
    state.view = view;
    render();
}

function recomputeMedStocks() {
    DB.medications.forEach(m => {
        let vit = 0, bod = 0;
        DB.batches.forEach(b => {
            if (b.id_medicamento === m.id_medicamento && b.activo && b.dias_restantes > 0 && b.cantidad > 0) {
                if (b.ubicacion === 'VITRINA') vit += b.cantidad;
                if (b.ubicacion === 'BODEGA') bod += b.cantidad;
            }
        });
        m.stock_vitrina = vit;
        m.stock_bodega = bod;
    });
}

function renderSidebar() {
    const allowed = getAllowedViews(state.role);
    const pendingCount = DB.ispLogs.filter(x => x.estado === 'PENDIENTE').length;
    document.getElementById('top-pending-count').textContent = pendingCount;
    const topBadge = document.getElementById('top-pending-badge');
    if (pendingCount > 0 && (state.role === 'administrador' || state.role === 'quimico_farmaceutico')) {
        topBadge.classList.remove('hidden');
    } else {
        topBadge.classList.add('hidden');
    }

    const items = [
        { id: 'dashboard', label: '📊 Dashboard' },
        { id: 'pos', label: '🛒 Punto de Venta' },
        { id: 'autorizaciones', label: '🛡️ Autorización', badge: pendingCount },
        { id: 'inventario', label: '📦 Inventario' },
        { id: 'convenios', label: '🏥 Convenios' },
        { id: 'usuarios', label: '👥 Usuarios' }
    ].filter(i => allowed.includes(i.id));

    document.getElementById('sidebar-nav').innerHTML = items.map(i => `
        <button onclick="navigate('${i.id}')"
                class="w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-xs font-medium transition ${state.view === i.id ? 'bg-[#1E40AF] text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
            <span class="flex items-center gap-2.5">${i.label}</span>
            ${i.badge ? `<span class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-[#EF4444] text-white animate-pulse-badge">${i.badge}</span>` : ''}
        </button>
    `).join('');
}

function render() {
    recomputeMedStocks();
    renderSidebar();
    const container = document.getElementById('main-content');
    if (state.view === 'dashboard') container.innerHTML = renderDashboard();
    else if (state.view === 'pos') container.innerHTML = renderPos();
    else if (state.view === 'autorizaciones') container.innerHTML = renderAutorizaciones();
    else if (state.view === 'inventario') container.innerHTML = renderInventario();
    else if (state.view === 'convenios') container.innerHTML = renderConvenios();
    else if (state.view === 'usuarios') container.innerHTML = renderUsuarios();
}

        if (state.invTab === 'BAJAS') {
            filtered = filtered.filter(b => !b.activo || b.dias_restantes <= 0);
        } else {
            filtered = filtered.filter(b => b.activo && (state.invTab === 'TODOS' || b.ubicacion === state.invTab));
        }

        const rows = filtered.length === 0
            ? `<tr><td colspan="10" class="py-10 text-center text-slate-400 text-xs">${state.invTab === 'BAJAS' ? 'No hay lotes dados de baja por caducidad o merma sanitaria en este momento.' : 'No hay lotes activos en esta ubicación.'}</td></tr>`
            : filtered.map(l => {
                const isCrit = l.dias_restantes <= 30;
                const isAlert = l.dias_restantes > 30 && l.dias_restantes <= 90;
                const rowBg = !l.activo ? 'bg-red-50/30 opacity-85' : (isCrit ? 'bg-red-50/40 hover:bg-red-50/70' : (isAlert ? 'bg-amber-50/40 hover:bg-amber-50/70' : 'hover:bg-slate-50/80'));
                const dotColor = !l.activo ? 'bg-red-400' : (isCrit ? 'bg-[#EF4444]' : (isAlert ? 'bg-amber-500' : 'bg-emerald-500'));
                const fefoBadge = isCrit
                    ? `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-red-100 text-[#EF4444] border border-red-200 whitespace-nowrap">● ${l.dias_restantes}d</span>`
                    : (isAlert
                        ? `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-300 whitespace-nowrap">▲ ${l.dias_restantes}d</span>`
                        : `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 whitespace-nowrap">✓ ${l.dias_restantes}d</span>`);

                let actionBtns = '';
                if (canToggleLote) {
                    if (l.activo && l.ubicacion === 'VITRINA') {
                        actionBtns += `<button onclick="openRetiroVitrinaModal(${l.id_lote})" class="px-2.5 py-1.5 rounded-lg border border-amber-300 bg-amber-50 hover:bg-amber-100 text-amber-900 font-bold text-[11px] transition">↓ Pasar a Bodega</button>`;
                    } else if (l.activo && l.ubicacion === 'BODEGA' && canManageStock) {
                        actionBtns += `<button onclick="openTraspasoBodegaModal(${l.id_lote})" class="px-2.5 py-1.5 rounded-lg border border-blue-200 bg-blue-50 hover:bg-blue-100 text-[#1E40AF] font-bold text-[11px] transition">↑ Pasar a Vitrina</button>`;
                    }
                    if (l.activo) {
                        actionBtns += `<button onclick="openBajaModal(${l.id_lote})" class="px-2.5 py-1.5 rounded-lg border border-red-200 bg-red-50/80 hover:bg-red-100 text-red-700 font-bold text-[11px] transition">${l.dias_restantes <= 30 ? '🗑️ Quitar por Caducado' : '🗑️ Dar de Baja'}</button>`;
                    } else {
                        actionBtns += `<button onclick="restoreBatch(${l.id_lote})" class="px-2.5 py-1.5 rounded-lg border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-[11px] transition">↺ Restaurar a ${l.ubicacion}</button>`;
                    }
                }

                return `
                <tr class="${rowBg} transition">
                    <td class="py-3.5 px-4 font-medium ${l.activo ? 'text-slate-900' : 'text-slate-500 line-through'} flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span>
                        <span>${l.medicamento}</span>
                    </td>
                    <td class="py-3.5 px-4 whitespace-nowrap">
                        ${l.requiere_receta
                            ? `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-red-50 text-red-700 border border-red-200 whitespace-nowrap">🔒 Retenida</span>`
                            : `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-600 whitespace-nowrap">Venta Libre</span>`}
                    </td>
                    <td class="py-3.5 px-4 font-mono-code text-[11px] text-slate-500 whitespace-nowrap">
                        <span class="inline-block px-2 py-0.5 rounded bg-slate-100 border border-slate-200 whitespace-nowrap">${l.lote_codigo}</span>
                    </td>
                    <td class="py-3.5 px-4 text-slate-500 whitespace-nowrap">${l.laboratorio}</td>
                    <td class="py-3.5 px-4">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${l.ubicacion === 'VITRINA' ? 'bg-blue-50 text-blue-700 border border-blue-200' : 'bg-slate-100 text-slate-700 border border-slate-300'}">${l.ubicacion}</span>
                        ${!l.activo && l.motivo_baja ? `<div class="text-[10px] text-red-700 font-semibold mt-1">${l.motivo_baja}</div>` : ''}
                    </td>
                    <td class="py-3.5 px-4 text-center font-bold text-slate-900 whitespace-nowrap">${l.cantidad}</td>
                    <td class="py-3.5 px-4 text-center font-mono-code text-slate-600 whitespace-nowrap">${l.fecha_vencimiento}</td>
                    <td class="py-3.5 px-4 text-center whitespace-nowrap">${fefoBadge}</td>
                    <td class="py-3.5 px-4 text-center whitespace-nowrap">
                        <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${l.activo ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700'}">${l.activo ? 'DISPONIBLE' : 'DADO DE BAJA'}</span>
                    </td>
                    ${canToggleLote ? `<td class="py-3.5 px-4 text-right whitespace-nowrap"><div class="inline-flex items-center justify-end gap-1.5">${actionBtns}</div></td>` : ''}
                </tr>`;
            }).join('');

        const banner = state.invTab === 'BAJAS'
            ? `<div class="p-3 rounded-xl bg-red-50/90 border border-red-200 text-red-900 text-xs font-medium flex items-center gap-2"><span>🗑️</span><span><strong>Registro de Bajas y Productos Caducados:</strong> Lotes retirados de Vitrina y Bodega por vencimiento, merma o alerta sanitaria.</span></div>`
            : `<div class="p-3 rounded-xl bg-blue-50/90 border border-blue-200 text-blue-800 text-xs font-medium flex items-center gap-2"><span>⬇️</span><span>Lotes activos ordenados por fecha de vencimiento (FEFO): los primeros en expirar se muestran primero.</span></div>`;

        bodyHtml = `
            ${banner}
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-slate-200 text-[11px] font-bold uppercase text-slate-400 bg-slate-50/60 whitespace-nowrap">
                                <th class="py-3.5 px-4">Medicamento</th>
                                <th class="py-3.5 px-4">Condición Venta</th>
                                <th class="py-3.5 px-4">Código Lote</th>
                                <th class="py-3.5 px-4">Laboratorio</th>
                                <th class="py-3.5 px-4">${state.invTab === 'BAJAS' ? 'Origen / Motivo de Baja' : 'Ubicación'}</th>
                                <th class="py-3.5 px-4 text-center">Cantidad</th>
                                <th class="py-3.5 px-4 text-center">Vencimiento</th>
                                <th class="py-3.5 px-4 text-center">Alerta FEFO</th>
                                <th class="py-3.5 px-4 text-center">Estado</th>
                                ${canToggleLote ? '<th class="py-3.5 px-4 text-right">Acciones</th>' : ''}
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100 text-xs">${rows}</tbody>
                    </table>
                </div>
            </div>`;
    }

    return `
    <div class="space-y-5">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Gestión de Inventario y Catálogo</h1>
                <p class="text-xs text-slate-500 mt-0.5">Control de lotes por vencimiento (FEFO), traspasos entre Vitrina y Bodega, y clasificación de recetas restringidas.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2.5">${topButtons}</div>
        </div>
        <div class="flex flex-wrap items-center gap-2">${tabs}</div>
        ${bodyHtml}
    </div>`;
}

function openBajaModal(idLote) {

    const modal = document.getElementById('app-modal');
    const body = document.getElementById('app-modal-body');
    const defMotivo = l.dias_restantes <= 0 ? 'Vencimiento / Producto Caducado' : (l.dias_restantes <= 30 ? 'Retiro Preventivo por Vencimiento Próximo' : 'Merma / Rotura o Deterioro de Envase');
    body.innerHTML = `
        <div class="bg-red-700 text-white px-5 py-4 flex items-center justify-between">
            <div>
                <h3 class="font-bold text-sm">🗑️ Quitar por Caducado / Dar de Baja</h3>

                    <option value="Retiro Preventivo por Vencimiento Próximo" ${defMotivo==='Retiro Preventivo por Vencimiento Próximo'?'selected':''}>Retiro Preventivo por Vencimiento Próximo</option>
                    <option value="Merma / Rotura o Deterioro de Envase" ${defMotivo==='Merma / Rotura o Deterioro de Envase'?'selected':''}>Merma / Rotura o Deterioro de Envase</option>

function confirmBaja(idLote) {
    const l = DB.batches.find(x => x.id_lote === idLote);
    if (!l) return;
    const motivo = document.getElementById('modal-baja-motivo').value;
    l.activo = false;
    l.motivo_baja = motivo;
    closeModal();
    showToast(`Lote ${l.lote_codigo} (${l.medicamento}) retirado de ${l.ubicacion} y movido a 'Bajas y Caducados' (${motivo}).`);
    render();
}

function restoreBatch(idLote) {
    const l = DB.batches.find(x => x.id_lote === idLote);
    if (!l) return;
    l.activo = true;
    l.motivo_baja = null;
    showToast(`Lote ${l.lote_codigo} (${l.medicamento}) restaurado a ${l.ubicacion}.`);
    render();
}

function openRetiroVitrinaModal(preId) {
    const vitBatches = DB.batches.filter(b => b.activo && b.ubicacion === 'VITRINA' && b.cantidad > 0);
    if (vitBatches.length === 0) return showToast('No hay lotes en Vitrina para retirar.', 'warning');
    const selected = preId ? vitBatches.find(x => x.id_lote === preId) || vitBatches[0] : vitBatches[0];
    const modal = document.getElementById('app-modal');
    const body = document.getElementById('app-modal-body');
    body.innerHTML = `
        <div class="bg-amber-600 text-white px-5 py-4 flex items-center justify-between">
            <div>
                <h3 class="font-bold text-sm">↓ Retirar o Devolver Vitrina &rarr; Bodega</h3>
                <p class="text-[11px] text-amber-100">Retira unidades o quita completamente el lote de la vitrina de ventas</p>
            </div>

                    ${vitBatches.map(b => `<option value="${b.id_lote}" ${b.id_lote===selected.id_lote?'selected':''}>${b.medicamento} — ${b.lote_codigo} (En vitrina: ${b.cantidad} u.)</option>`).join('')}

            </div>
            <div>

                <input type="number" id="retiro-cant" value="${selected.cantidad}" min="1" class="w-full px-3 py-2 rounded-lg border border-slate-300 font-mono-code font-bold">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-600">Cancelar</button>
                <button onclick="confirmRetiroVitrina()" class="px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-bold">Confirmar Retiro a Bodega</button>

        </div>`;
    modal.classList.remove('hidden');
}

function confirmRetiroVitrina() {
    const idLote = Number(document.getElementById('retiro-lote-id').value);
    const cant = Number(document.getElementById('retiro-cant').value);
    const l = DB.batches.find(x => x.id_lote === idLote);
    if (!l || cant <= 0 || cant > l.cantidad) return showToast('Cantidad inválida.', 'error');
    l.cantidad -= cant;
    let bod = DB.batches.find(x => x.lote_codigo === l.lote_codigo && x.ubicacion === 'BODEGA');
    if (bod) bod.cantidad += cant;
    else DB.batches.push({ ...l, id_lote: Date.now(), ubicacion: 'BODEGA', cantidad: cant });
    closeModal();
    showToast(`Retiro completado: ${cant} u. de ${l.medicamento} traspasadas desde Vitrina hacia Bodega.`);
    render();
}

function confirmNewMed() {
    const nombre = document.getElementById('newmed-nombre').value.trim();
    const pa = document.getElementById('newmed-pa').value.trim();
    const lab = document.getElementById('newmed-lab').value.trim();
    const precio = Number(document.getElementById('newmed-precio').value);
    const rec = document.getElementById('newmed-receta').value === '1';
    if (!nombre) return showToast('Ingrese el nombre comercial.', 'error');
    const newId = Date.now();
    DB.medications.push({
        id_medicamento: newId,
        codigo_barras: '78000010' + Math.floor(1000+Math.random()*8999),
        nombre_comercial: nombre,
        principio_activo: pa || nombre,
        laboratorio: lab || 'Laboratorio Chile',
        categoria: 'General',
        precio_unitario: precio,
        requiere_receta: rec,
        activo: true,
        stock_vitrina: 40,
        stock_bodega: 0
    });
    DB.batches.push({
        id_lote: newId + 1,
        id_medicamento: newId,
        medicamento: nombre,
        laboratorio: lab || 'Laboratorio Chile',
        requiere_receta: rec,
        lote_codigo: 'LOT-2026-901',
        ubicacion: 'VITRINA',
        cantidad: 40,
        fecha_vencimiento: '15-08-2027',
        dias_restantes: 270,
        semaforo_fefo: 'vigente',
        activo: true,
        motivo_baja: null
    });
    closeModal();
    showToast(`Medicamento '${nombre}' registrado en el catálogo con lote inicial de 40 u.`);
    render();
}

function toggleMedPrescription(idMed) {
    const m = DB.medications.find(x => x.id_medicamento === idMed);
    if (!m) return;
    m.requiere_receta = !m.requiere_receta;
    DB.batches.filter(b => b.id_medicamento === idMed).forEach(b => b.requiere_receta = m.requiere_receta);
    showToast(`'${m.nombre_comercial}' cambió a ${m.requiere_receta ? 'Receta Retenida ISP' : 'Venta Libre'}.`);
    render();
}

/* ==================== 2. PUNTO DE VENTA (POS) ==================== */
function renderPos() {
    const conv = DB.convenios.find(c => c.id_convenio === Number(state.posConvenioId)) || DB.convenios[0];
    const cats = ['TODAS', ...new Set(DB.medications.map(m => m.categoria))];

    const isCovered = (med) => {
        if (!conv || conv.porcentaje_descuento <= 0) return false;
        if (conv.aplica_todo_catalogo) return true;
        return conv.medicamentos_ids.includes(med.id_medicamento);
    };

    const meds = DB.medications.filter(m => {
        if (!m.activo) return false;
        if (state.posCat !== 'TODAS' && m.categoria !== state.posCat) return false;
        if (state.posOnlyCovered && !isCovered(m)) return false;
        if (state.posSearch) {
            const q = state.posSearch.toLowerCase();
            return m.nombre_comercial.toLowerCase().includes(q) || m.principio_activo.toLowerCase().includes(q) || m.codigo_barras.includes(q);
        }
        return true;
    });

    let subtotal = 0, descuentoTotal = 0, hasRetained = false;
    const cartRows = state.posCart.map(item => {
        const m = DB.medications.find(x => x.id_medicamento === item.id_medicamento);
        if (!m) return '';
        if (m.requiere_receta) hasRetained = true;
        const lineSub = m.precio_unitario * item.cantidad;
        const cubierto = isCovered(m);
        const lineDesc = cubierto ? Math.round(lineSub * (conv.porcentaje_descuento / 100)) : 0;
        subtotal += lineSub;
        descuentoTotal += lineDesc;
        return `
        <div class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-2">
            <div>
                <div class="font-bold text-slate-900 text-xs">${m.nombre_comercial} ${m.requiere_receta ? '<span class="text-[10px] px-1.5 py-0.5 rounded bg-red-100 text-red-700 font-bold">🔒 Retenida</span>' : ''}</div>
                <div class="text-[11px] text-slate-500 font-mono-code">${fmtClp(m.precio_unitario)} x ${item.cantidad} = ${fmtClp(lineSub)}</div>
                ${conv.porcentaje_descuento > 0 ? (cubierto
                    ? `<div class="text-[10px] text-emerald-700 font-bold">✓ Bonifica -${conv.porcentaje_descuento}% (-${fmtClp(lineDesc)})</div>`
                    : `<div class="text-[10px] text-slate-400">Sin cobertura en ${conv.nombre_convenio}</div>`) : ''}
            </div>
            <div class="flex items-center gap-1">
                <button onclick="updateCartQty(${m.id_medicamento}, -1)" class="w-6 h-6 rounded bg-white border border-slate-300 font-bold">-</button>
                <span class="px-2 font-mono-code font-bold text-xs">${item.cantidad}</span>
                <button onclick="updateCartQty(${m.id_medicamento}, 1)" class="w-6 h-6 rounded bg-white border border-slate-300 font-bold">+</button>
            </div>
        </div>`;
    }).join('');

    const total = subtotal - descuentoTotal;

    return `
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-2 space-y-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div>
                        <h1 class="text-lg font-bold text-slate-900">Terminal Punto de Venta (POS)</h1>
                        <p class="text-xs text-slate-500">Dispensación FEFO desde Vitrina y cálculo de copago por medicamento cubierto.</p>
                    </div>
                    <label class="inline-flex items-center gap-2 text-xs font-semibold text-[#1E40AF] cursor-pointer">
                        <input type="checkbox" ${state.posOnlyCovered ? 'checked' : ''} onchange="state.posOnlyCovered=this.checked; render();" class="rounded border-slate-300">
                        Solo cubiertos por convenio activo
                    </label>
                </div>
                <input type="text" value="${state.posSearch}" oninput="state.posSearch=this.value; render();" placeholder="🔍 Buscar por nombre comercial, principio activo o código de barras..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs">
                <div class="flex flex-wrap gap-1.5">
                    ${cats.map(cat => `<button onclick="state.posCat='${cat}'; render();" class="px-2.5 py-1 rounded-lg text-[11px] font-bold border ${state.posCat===cat ? 'bg-[#1E40AF] text-white border-[#1E40AF]' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">${cat}</button>`).join('')}
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
                ${meds.map(m => {
                    const cub = isCovered(m);
                    return `
                    <div class="bg-white rounded-xl border ${m.requiere_receta ? 'border-red-200' : 'border-slate-200'} p-3.5 shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="flex items-center justify-between gap-1 mb-1">
                                <span class="text-[10px] font-mono-code text-slate-400">${m.codigo_barras}</span>
                                ${m.requiere_receta
                                    ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-50 text-red-700 border border-red-200">🔒 Retenida</span>`
                                    : `<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-600">Venta Libre</span>`}
                            </div>
                            <div class="font-bold text-xs text-slate-900">${m.nombre_comercial}</div>
                            <div class="text-[11px] text-slate-400">${m.principio_activo} • ${m.laboratorio}</div>
                            ${conv.porcentaje_descuento > 0 ? (cub
                                ? `<div class="mt-1.5 inline-block px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-bold">✓ Cubierto -${conv.porcentaje_descuento}% (${conv.nombre_convenio})</div>`

                            </div>
                            <button onclick="addToCart(${m.id_medicamento})" ${m.stock_vitrina <= 0 ? 'disabled' : ''} class="px-3 py-1.5 rounded-lg ${m.stock_vitrina > 0 ? 'bg-[#1E40AF] hover:bg-blue-800 text-white' : 'bg-slate-100 text-slate-400 cursor-not-allowed'} text-xs font-bold transition">
                                + Agregar
                            </button>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        </div>

        <!-- Carrito y Liquidación -->
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between h-fit sticky top-16 space-y-4">
            <div class="space-y-4">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h2 class="font-bold text-sm text-slate-900">🛒 Detalle de Venta</h2>
                    ${state.posCart.length > 0 ? `<button onclick="state.posCart=[]; render();" class="text-[11px] text-red-600 font-semibold hover:underline">Vaciar</button>` : ''}
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Convenio de Salud / Previsión</label>
                    <select onchange="state.posConvenioId=Number(this.value); render();" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-semibold bg-white">
                        ${DB.convenios.filter(c => c.activo && c.estado_vigencia === 'VIGENTE').map(c => `<option value="${c.id_convenio}" ${c.id_convenio===conv.id_convenio?'selected':''}>${c.nombre_convenio} (${c.porcentaje_descuento}% bonif.)</option>`).join('')}

                </div>

                <div class="space-y-2 max-h-72 overflow-y-auto">
                    ${state.posCart.length === 0 ? `<div class="py-10 text-center text-slate-400 text-xs">Seleccione medicamentos del catálogo para iniciar la venta.</div>` : cartRows}
                </div>
            </div>

            <div class="border-t border-slate-200 pt-4 space-y-2 text-xs">
                <div class="flex justify-between text-slate-500"><span>Subtotal Bruto:</span><span class="font-mono-code font-semibold">${fmtClp(subtotal)}</span></div>
                <div class="flex justify-between text-emerald-700 font-semibold"><span>Bonificación Convenio:</span><span class="font-mono-code">-${fmtClp(descuentoTotal)}</span></div>
                <div class="flex justify-between text-base font-extrabold text-slate-900 pt-2 border-t border-slate-100"><span>Total Copago a Pagar:</span><span class="font-mono-code text-[#1E40AF]">${fmtClp(total)}</span></div>

                ${hasRetained ? `
                    <div class="p-3 rounded-xl bg-red-50 border border-red-200 text-red-800 text-[11px] space-y-2 mt-2">
                        <div class="font-bold">🔒 Bloqueo Sanitario ISP: Receta Retenida</div>
                        <div>El carrito incluye medicamentos controlados. Requiere autorización con PIN del Químico Farmacéutico (PIN demo: <code>4421</code>).</div>
                        <input type="password" id="pos-pin-qf" placeholder="Ingrese PIN Q.F. (4421)" class="w-full px-3 py-1.5 rounded-lg border border-red-300 bg-white font-mono-code">
                    </div>` : ''}

                <button onclick="checkoutPos()" ${state.posCart.length===0?'disabled':''} class="w-full py-3 rounded-xl ${state.posCart.length>0 ? 'bg-[#10B981] hover:bg-emerald-700 text-white' : 'bg-slate-100 text-slate-400 cursor-not-allowed'} font-bold text-xs shadow-sm transition mt-2">
                    Emitir Boleta y Descontar FEFO
                </button>
            </div>
        </div>
    </div>`;
}

function addToCart(idMed) {
    const m = DB.medications.find(x => x.id_medicamento === idMed);
    if (!m || m.stock_vitrina <= 0) return;
    const item = state.posCart.find(i => i.id_medicamento === idMed);
    if (item) {
        if (item.cantidad + 1 > m.stock_vitrina) return showToast('Supera el stock disponible en Vitrina.', 'warning');
        item.cantidad++;
    } else {
        state.posCart.push({ id_medicamento: idMed, cantidad: 1 });
    }
    render();
}

function updateCartQty(idMed, delta) {
    const idx = state.posCart.findIndex(i => i.id_medicamento === idMed);
    if (idx === -1) return;
    const m = DB.medications.find(x => x.id_medicamento === idMed);
    const next = state.posCart[idx].cantidad + delta;
    if (next <= 0) state.posCart.splice(idx, 1);
    else if (next <= m.stock_vitrina) state.posCart[idx].cantidad = next;
    render();
}

function checkoutPos() {
    const hasRetained = state.posCart.some(i => DB.medications.find(m => m.id_medicamento === i.id_medicamento)?.requiere_receta);
    if (hasRetained) {
        const pin = document.getElementById('pos-pin-qf')?.value || '';
        if (pin !== '4421') {
            return showToast('Bloqueo ISP: Debe ingresar el PIN del Químico Farmacéutico (4421) para dispensar medicamentos con Receta Retenida.', 'error');
        }
    }

    const conv = DB.convenios.find(c => c.id_convenio === Number(state.posConvenioId)) || DB.convenios[0];
    let subtotal = 0, desc = 0;
    const resumen = [];

    state.posCart.forEach(item => {
        const m = DB.medications.find(x => x.id_medicamento === item.id_medicamento);
        const lineSub = m.precio_unitario * item.cantidad;
        const cub = conv.porcentaje_descuento > 0 && (conv.aplica_todo_catalogo || conv.medicamentos_ids.includes(m.id_medicamento));
        subtotal += lineSub;
        if (cub) desc += Math.round(lineSub * (conv.porcentaje_descuento / 100));
        resumen.push(`${m.nombre_comercial} x${item.cantidad}`);

        let rem = item.cantidad;
        DB.batches.filter(b => b.id_medicamento === m.id_medicamento && b.activo && b.ubicacion === 'VITRINA' && b.cantidad > 0)
            .sort((a, b) => a.dias_restantes - b.dias_restantes)
            .forEach(b => {
                if (rem <= 0) return;
                const take = Math.min(b.cantidad, rem);
                b.cantidad -= take;
                rem -= take;
            });
    });

    DB.sales.unshift({
        id_venta: DB.sales.length + 101,
        fecha_hora: new Date().toLocaleString('es-CL'),
        vendedor: ROLES_USER[state.role].nombre,
        convenio: conv.nombre_convenio,
        subtotal: subtotal,
        descuento_total: desc,
        total: subtotal - desc,
        items_resumen: resumen.join(', ')
    });

    state.posCart = [];
    showToast(`Venta procesada con éxito. Total pagado: ${fmtClp(subtotal - desc)} (Descuento convenio: ${fmtClp(desc)}).`);
    render();
}

/* ==================== 3. CONVENIOS DE SALUD ==================== */

function toggleConvenioStatus(idConv) {
    const c = DB.convenios.find(x => x.id_convenio === idConv);

    c.estado_vigencia = c.activo ? 'VIGENTE' : 'DESHABILITADO';
    showToast(`Convenio '${c.nombre_convenio}' ${c.activo ? 'habilitado' : 'deshabilitado'}.`);
    render();
}

            <td class="py-3.5 px-4 font-bold text-slate-900">${r.medicamento} <span class="font-mono-code text-slate-500">(${r.cantidad_prescrita} u.)</span></td>
            <td class="py-3.5 px-4"><div>${r.nombre_paciente}</div><div class="text-[10px] font-mono-code text-slate-400">${r.rut_paciente}</div></td>
            <td class="py-3.5 px-4"><div>${r.nombre_medico}</div><div class="text-[10px] font-mono-code text-slate-400">${r.rut_medico}</div></td>
            <td class="py-3.5 px-4 text-center">
                <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${r.estado==='APROBADA' ? 'bg-emerald-100 text-emerald-800' : (r.estado==='PENDIENTE' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-700')}">${r.estado}</span>
            </td>
            <td class="py-3.5 px-4 text-right">
                ${r.estado === 'PENDIENTE'
                    ? `<button onclick="approveIsp(${r.id_registro})" class="px-3 py-1.5 rounded-lg bg-[#10B981] hover:bg-emerald-700 text-white font-bold text-[11px]">✍️ Visar con PIN Q.F. (4421)</button>`
                    : `<span class="text-[11px] text-slate-500 font-mono-code">${r.qf_nombre} (${r.fecha})</span>`}
            </td>
        </tr>`).join('');

    return `
    <div class="space-y-5">
        <div>
            <h1 class="text-xl font-bold text-slate-900">Libro Oficial de Control ISP y Recetas Retenidas</h1>
            <p class="text-xs text-slate-500 mt-0.5">Fiscalización y visación electrónica del Químico Farmacéutico (D.S. N° 404 / N° 405 MINSAL).</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-[11px] font-bold uppercase text-slate-400 bg-slate-50/60">
                            <th class="py-3.5 px-4">Folio Receta</th>
                            <th class="py-3.5 px-4">Medicamento Controlado</th>
                            <th class="py-3.5 px-4">Paciente</th>
                            <th class="py-3.5 px-4">Médico Prescriptor</th>
                            <th class="py-3.5 px-4 text-center">Estado</th>
                            <th class="py-3.5 px-4 text-right">Firma Sanitaria</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-xs">${rows}</tbody>
                </table>
            </div>
        </div>
    </div>`;
}

function approveIsp(idReg) {
    const r = DB.ispLogs.find(x => x.id_registro === idReg);
    if (!r) return;
    r.estado = 'APROBADA';
    r.qf_nombre = 'Dr. Carlos Vega';
    r.fecha = new Date().toLocaleString('es-CL');
    showToast(`Receta Folio ${r.nro_folio_receta} (${r.medicamento}) visada electrónicamente por Dr. Carlos Vega.`);
    render();
}

/* ==================== 5. DASHBOARD ==================== */
function renderDashboard() {
    const totalVentas = DB.sales.reduce((s, v) => s + v.total, 0);
    const totalDescuentos = DB.sales.reduce((s, v) => s + v.descuento_total, 0);
    const neto = Math.round(totalVentas / 1.19);
    const iva = totalVentas - neto;
    const lotesActivos = DB.batches.filter(b => b.activo && b.cantidad > 0).length;
    const lotesCriticos = DB.batches.filter(b => b.activo && b.cantidad > 0 && b.dias_restantes <= 30).length;

    return `
    <div class="space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900">Dashboard de Gestión de Farmacia Privada</h1>
                <p class="text-xs text-slate-500 mt-0.5">Indicadores comerciales (SII), control de inventario FEFO y auditoría sanitaria ISP.</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="window.print()" class="px-4 py-2 rounded-lg bg-[#1E40AF] hover:bg-blue-800 text-white text-xs font-bold shadow-sm">🖨️ Imprimir / Guardar PDF</button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-bold text-slate-400 uppercase">Ingresos Totales (Copago)</div>
                <div class="text-2xl font-extrabold text-slate-900 font-mono-code mt-1">${fmtClp(totalVentas)}</div>
                <div class="text-[11px] text-slate-500 mt-1">Neto: ${fmtClp(neto)} • IVA (19%): ${fmtClp(iva)}</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-bold text-slate-400 uppercase">Ahorro a Pacientes (Convenios)</div>
                <div class="text-2xl font-extrabold text-emerald-600 font-mono-code mt-1">${fmtClp(totalDescuentos)}</div>
                <div class="text-[11px] text-slate-500 mt-1">${DB.sales.length} boletas emitidas</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="text-xs font-bold text-slate-400 uppercase">Catálogo y Stock Activo</div>
                <div class="text-2xl font-extrabold text-[#1E40AF] font-mono-code mt-1">${DB.medications.length} prod.</div>
                <div class="text-[11px] text-slate-500 mt-1">${lotesActivos} lotes activos en Vitrina/Bodega</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-red-200 shadow-sm">
                <div class="text-xs font-bold text-red-500 uppercase">Riesgo FEFO (&le; 30 días)</div>
                <div class="text-2xl font-extrabold text-red-600 font-mono-code mt-1">${lotesCriticos} lotes</div>
                <div class="text-[11px] text-slate-500 mt-1">Prioridad de salida o baja por caducado</div>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 bg-slate-50/60">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-700">Últimas Ventas y Boletas Registradas</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-[11px] font-bold uppercase text-slate-400 bg-slate-50/40">
                            <th class="py-3 px-4">Folio</th>
                            <th class="py-3 px-4">Fecha / Hora</th>
                            <th class="py-3 px-4">Vendedor</th>
                            <th class="py-3 px-4">Convenio</th>
                            <th class="py-3 px-4">Productos</th>
                            <th class="py-3 px-4 text-right">Subtotal</th>
                            <th class="py-3 px-4 text-right">Bonificación</th>
                            <th class="py-3 px-4 text-right">Total Pagado</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-xs">
                        ${DB.sales.map(v => `
                            <tr class="hover:bg-slate-50/80">
                                <td class="py-3 px-4 font-mono-code font-bold text-slate-700">#${v.id_venta}</td>
                                <td class="py-3 px-4 font-mono-code text-slate-500">${v.fecha_hora}</td>
                                <td class="py-3 px-4 font-semibold">${v.vendedor}</td>
                                <td class="py-3 px-4"><span class="px-2 py-0.5 rounded bg-blue-50 text-[#1E40AF] font-semibold text-[11px]">${v.convenio}</span></td>
                                <td class="py-3 px-4 text-slate-600">${v.items_resumen}</td>
                                <td class="py-3 px-4 text-right font-mono-code">${fmtClp(v.subtotal)}</td>
                                <td class="py-3 px-4 text-right font-mono-code text-emerald-700">-${fmtClp(v.descuento_total)}</td>
                                <td class="py-3 px-4 text-right font-mono-code font-bold text-slate-900">${fmtClp(v.total)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    </div>`;
}

/* ==================== 6. USUARIOS ==================== */
function renderUsuarios() {
    const rows = DB.users.map(u => `
        <tr class="hover:bg-slate-50/80 ${!u.activo ? 'bg-slate-50/60 opacity-75' : ''}">
            <td class="py-3 px-5 font-mono-code text-slate-400">#${u.id_usuario}</td>
            <td class="py-3 px-5 font-mono-code font-bold text-slate-900">${u.rut}</td>
            <td class="py-3 px-5 font-semibold ${u.activo ? 'text-slate-800' : 'text-slate-400 line-through'}">${u.nombre_completo}</td>
            <td class="py-3 px-5 text-slate-500">${u.email}</td>
            <td class="py-3 px-5"><span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 font-semibold text-[11px]">${u.role_label}</span></td>
            <td class="py-3 px-5 text-center"><span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${u.activo ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700'}">${u.activo ? 'ACTIVO' : 'DESHABILITADO'}</span></td>
            <td class="py-3 px-5 text-center text-[11px] font-mono-code text-slate-400">${u.tiene_pin ? '🔑 Habilitado Q.F.' : 'Estándar'}</td>
            <td class="py-3 px-5 text-right">
                <button onclick="toggleUserActive(${u.id_usuario})" class="px-2.5 py-1.5 rounded-lg border ${u.activo ? 'border-red-200 bg-red-50 text-red-700' : 'border-emerald-200 bg-emerald-50 text-emerald-700'} font-bold text-[11px]">
                    ${u.activo ? 'Deshabilitar' : 'Habilitar'}
                </button>
            </td>
        </tr>`).join('');

    return `
    <div class="space-y-6">
        <div>
            <h1 class="text-xl font-bold text-slate-900">Gestión de Usuarios y Registro de Actividad</h1>
            <p class="text-xs text-slate-500 mt-0.5">Administración de cuentas del personal de la farmacia, asignación de cargos y bitácora del sistema.</p>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-200 text-[11px] font-bold uppercase text-slate-400 bg-slate-50/40">
                            <th class="py-3 px-5">ID</th>
                            <th class="py-3 px-5">RUN</th>
                            <th class="py-3 px-5">Nombre Completo</th>
                            <th class="py-3 px-5">Correo Electrónico</th>
                            <th class="py-3 px-5">Cargo / Perfil</th>
                            <th class="py-3 px-5 text-center">Estado</th>
                            <th class="py-3 px-5 text-center">Firma ISP</th>
                            <th class="py-3 px-5 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 text-xs">${rows}</tbody>
                </table>
            </div>
        </div>
    </div>`;
}

function toggleUserActive(idU) {
    const u = DB.users.find(x => x.id_usuario === idU);
    if (!u) return;
    u.activo = !u.activo;
    showToast(`Usuario ${u.nombre_completo} ${u.activo ? 'habilitado' : 'deshabilitado'}.`);
    render();
}

setInterval(() => {
    const el = document.getElementById('live-clock');
    if (el) el.textContent = new Date().toLocaleTimeString('es-CL');
}, 1000);
document.getElementById('live-clock').textContent = new Date().toLocaleTimeString('es-CL');
render();
</script>
</body>
</html>
